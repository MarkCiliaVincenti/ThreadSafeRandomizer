name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
            8.0.x
            9.0.x
            11.0.100
            
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test .NET 8.0
      run: dotnet test ThreadSafeRandomizer.Tests\ThreadSafeRandomizer.Tests.csproj --framework net8.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net8.0.cobertura.xml --results-directory ${{ github.workspace }}\coverage

    - name: Test .NET 9.0
      run: dotnet test ThreadSafeRandomizer.Tests\ThreadSafeRandomizer.Tests.csproj --framework net9.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net9.0.cobertura.xml --results-directory ${{ github.workspace }}\coverage

    - name: Test .NET 11.0
      run: dotnet test ThreadSafeRandomizer.Tests\ThreadSafeRandomizer.Tests.csproj --framework net11.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net11.0.cobertura.xml --results-directory ${{ github.workspace }}\coverage

    - name: Test .NET Framework
      run: dotnet test ThreadSafeRandomizer.Tests\ThreadSafeRandomizer.Tests.csproj --framework net48 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net48.cobertura.xml --results-directory ${{ github.workspace }}\coverage

    - name: Test .NET 8.0 (source generator)
      run: dotnet test ThreadSafeRandomizer.SourceGenerator.Tests\ThreadSafeRandomizer.SourceGenerator.Tests.csproj --framework net8.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net8.0.sc.cobertura.xml --results-directory ${{ github.workspace }}\coverage

    - name: Test .NET 9.0 (source generator)
      run: dotnet test ThreadSafeRandomizer.SourceGenerator.Tests\ThreadSafeRandomizer.SourceGenerator.Tests.csproj --framework net9.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net9.0.sc.cobertura.xml --results-directory ${{ github.workspace }}\coverage

    - name: Test .NET 11.0 (source generator)
      run: dotnet test ThreadSafeRandomizer.SourceGenerator.Tests\ThreadSafeRandomizer.SourceGenerator.Tests.csproj --framework net11.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net11.0.sc.cobertura.xml --results-directory ${{ github.workspace }}\coverage

    - name: Test .NET Framework (source generator)
      run: dotnet test ThreadSafeRandomizer.SourceGenerator.Tests\ThreadSafeRandomizer.SourceGenerator.Tests.csproj --framework net48 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net48.sc.cobertura.xml --results-directory ${{ github.workspace }}\coverage
      
    - name: Code Coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
